name: Website

# Publishes the interactive 3D simulation (tools/build_web.py -> site/) on
# GitHub Pages. One-time setup: Settings -> Pages -> Source: "GitHub Actions".

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smartbin-sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # same as Pyodide 0.27 in the browser
      - run: pip install -r requirements-dev.txt
      - name: Tests (never publish a broken core)
        run: python -m pytest -q
      - name: Build static site
        run: python tools/build_web.py --out site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: smartbin-sim/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
