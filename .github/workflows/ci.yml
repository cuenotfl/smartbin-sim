name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smartbin-sim
    strategy:
      matrix:
        python: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements-dev.txt
      - name: Unit, contract and scenario tests
        run: python -m pytest -q
      - name: Simulated day (1000 throws) must meet MUSS-01..03
        run: python -m sim.run --config config/station-3-via-flaps.yaml --throws 1000 --seed 42 --json report.json
      - name: Same day on a noisy serial line (2 % corrupted frames)
        run: python -m sim.run --config config/station-3-via-flaps.yaml --throws 1000 --seed 42 --set corrupt_rate=0.02
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sim-report-py${{ matrix.python }}
          path: smartbin-sim/report.json

  firmware:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smartbin-sim/firmware
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('smartbin-sim/firmware/platformio.ini') }}
      - run: pip install platformio
      - name: Protocol contract + state machine on the host
        run: pio test -e native
      - name: Build ESP32-CAM and Wokwi firmware
        run: pio run -e esp32cam -e wokwi
