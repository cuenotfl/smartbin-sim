; Smart Bin module firmware. See README.md in this folder.
;   pio run -e esp32cam -t upload        real module (set MODULE_ID per module!)
;   pio run -e wokwi                     build for the Wokwi simulator
;   pio test -e native                   protocol + state machine tests on the PC

[platformio]
default_envs = esp32cam

[common]
; Arduino-ESP32 2.0.x (LEDC API ledcSetup/ledcAttachPin, neopixelWrite)
platform = espressif32@6.9.0
framework = arduino
build_flags =
    -DMODULE_ID=1
    -DSERIAL_BAUD=921600
    -DCORE_DEBUG_LEVEL=0

[env:esp32cam]
extends = common
board = esp32cam
board_build.partitions = huge_app.csv
build_flags =
    ${common.build_flags}
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
;   -DHAS_END_SWITCH        ; once an end switch is fitted at full tilt (BLOCKADE detection)

[env:wokwi]
extends = common
board = esp32dev
build_flags =
    ${common.build_flags}
    -DSMARTBIN_WOKWI
    -UMODULE_ID -DMODULE_ID=2      ; the ALU module of config/station-wokwi.yaml

[env:native]
; host unit tests, needs gcc/g++ (Linux/macOS, or MinGW on Windows)
platform = native
test_framework = unity
build_flags = -std=c++11 -Wall -Wextra
build_src_filter = -<*>          ; src/main.cpp is Arduino-only
